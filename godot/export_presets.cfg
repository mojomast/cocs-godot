[preset.0]
name="Linux Diagnostic (not a game release)"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="port_diagnostic"
export_filter="all_resources"
include_filter="content/generated/*.json,content/generated/maps/*/*.json,player_models/*.json,moth/generated/*.json,moth/derived/*.json,first_person/*.json,first_person/generated/*.json,native_arenas/generated/*.json,identity_maps/generated/*.json,horde_maps/generated/*.json,campaign/generated/*.json,career/*.json,experience/*.json,player_gameplay/catalog.json,ui/*.json,ui/attract/*.json,audio/music/*.json,audio/music/orchestral/*.json,audio/announcer/*.json,audio/moth/*.json"
exclude_filter="tests/*,content/probes/*"
export_path="../.port-runtime/destinations-diagnostic.x86_64"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
ssh_remote_deploy/enabled=false
