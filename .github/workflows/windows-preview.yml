name: Windows focused preview verification
on:
  push:
    branches: [preview/windows-focused-g3]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      candidate:
        required: true
        type: string
      helix_diagnostic:
        description: Run the unchanged-bound single-case Helix observer instead of the focused preview routes
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || 'cb6e4c9f6bff09aafe4d9ef6262c5996a6219329' }}
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verifier
      - name: Extract and validate exact preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'quiet-relay-fighting-vehicles-preview-2026-10-03' }}
          CANDIDATE: ${{ inputs.candidate || 'cb6e4c9f6bff09aafe4d9ef6262c5996a6219329' }}
        run: |
          if ($env:CANDIDATE -cnotmatch '^[0-9a-f]{40}$') { throw 'Exact candidate required' }
          if ((git -C candidate rev-parse HEAD).Trim() -ne $env:CANDIDATE) { throw 'Candidate checkout mismatch' }
          $download = Join-Path $env:RUNNER_TEMP 'preview-download'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'cocs-native-windows.zip*' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $zip = Join-Path $download 'cocs-native-windows.zip'
          $expected = ((Get-Content "$zip.sha256").Split(' ')[0]).ToLower()
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'ZIP hash mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'fresh focused Windows preview'
          Expand-Archive $zip $extract
          $root = Join-Path $extract 'cocs-native-windows'
          $manifest = Get-Content (Join-Path $root 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.port_commit -ne $env:CANDIDATE -or $manifest.target -ne 'windows' -or $manifest.build_channel -ne 'preview') { throw 'Wrong preview identity' }
          & "$root\node.exe" verifier/tools/godot-package/manifest_validation.mjs --package "$root" --repo "$env:GITHUB_WORKSPACE\candidate" --json
          if ($LASTEXITCODE -ne 0) { throw 'Recorded artifact validation failed' }
          "DEMO_ROOT=$root" >> $env:GITHUB_ENV
      - name: Extracted resources and graphical preview routes
        if: ${{ !inputs.helix_diagnostic }}
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:NODE_OPTIONS,Env:NODE_PATH,Env:COCS_SOURCE_DERIVATIVE -ErrorAction SilentlyContinue
          & "$env:DEMO_ROOT\node.exe" verifier/tools/godot-package/verify_preview_windows.mjs "$env:DEMO_ROOT" "$env:RUNNER_TEMP\preview-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Focused native preview failed' }
      - name: Single-case Helix startup diagnostic
        if: ${{ inputs.helix_diagnostic }}
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:LP_NUM_THREADS = '1'
          Remove-Item Env:NODE_OPTIONS,Env:NODE_PATH,Env:COCS_SOURCE_DERIVATIVE -ErrorAction SilentlyContinue
          & "$env:DEMO_ROOT\node.exe" verifier/tools/godot-package/verify_expansion.mjs "$env:DEMO_ROOT" "$env:RUNNER_TEMP\preview-evidence\helix" --case=helix-conservatory/deathmatch --diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Helix diagnostic failed; retain phase logs and CPU profile' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-focused-preview
          path: ${{ runner.temp }}/preview-evidence/
