name: Windows campaign startup diagnostic
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft or published release containing the unchanged Windows ZIP
        required: true
        type: string
permissions:
  contents: write
jobs:
  campaign-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate exact archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'diagnostic-download'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'cocs-native-windows.zip*' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $zip = Join-Path $download 'cocs-native-windows.zip'
          $expected = ((Get-Content "$zip.sha256").Split(' ')[0]).ToLower()
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'ZIP checksum mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'diagnostic Windows package'
          Expand-Archive $zip $extract
          "DEMO_ROOT=$extract\cocs-native-windows" >> $env:GITHUB_ENV
      - name: Three independent Crown startup observations
        shell: pwsh
        run: |
          $failed = 0
          foreach ($attempt in 1..3) {
            & "$env:DEMO_ROOT\node.exe" port/singleplayer-feel/startup_probe.mjs --run-native "--package=$env:DEMO_ROOT" "--output=$env:RUNNER_TEMP\startup-evidence\attempt-$attempt"
            if ($LASTEXITCODE -ne 0) { $failed += 1 }
          }
          if ($failed -gt 0) { throw "$failed of 3 startup observations failed; inspect transport/native evidence" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-diagnostic
          path: ${{ runner.temp }}/startup-evidence/
          if-no-files-found: warn
